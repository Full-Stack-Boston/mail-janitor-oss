# Authentik forward-auth for Mail Janitor clients (+ identity headers for ephemeral workspaces)
# forward_single: start/callback MUST hit this host's outpost path (fsb-03 authentik-proxy),
# not auth.fullstackboston.com (embedded outpost only has Domain SSO → redirect loops).
#
# IMPORTANT: NPM's auto `location /` sets proxy_set_header Upgrade/Connection, which makes
# nginx DROP server-level proxy_set_header (including X-authentik-*). Define our own
# `location /` here (inserted before NPM's) so identity headers actually reach :8788.
auth_request /outpost-auth-nginx;
error_page 401 = @goauthentik_login;

auth_request_set $authentik_username $upstream_http_x_authentik_username;
auth_request_set $authentik_email $upstream_http_x_authentik_email;
auth_request_set $authentik_uid $upstream_http_x_authentik_uid;
auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
auth_request_set $authentik_name $upstream_http_x_authentik_name;

location /outpost-auth-nginx {
    proxy_pass http://authentik-proxy:9000/outpost.goauthentik.io/auth/nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Content-Length "";
    proxy_method $request_method;
    proxy_pass_request_body off;
}

location @goauthentik_login {
    return 302 $scheme://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}

location /outpost.goauthentik.io {
    proxy_pass http://authentik-proxy:9000/outpost.goauthentik.io;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    proxy_set_header X-authentik-username $authentik_username;
    proxy_set_header X-authentik-email $authentik_email;
    proxy_set_header X-authentik-uid $authentik_uid;
    proxy_set_header X-authentik-groups $authentik_groups;
    proxy_set_header X-authentik-name $authentik_name;

    # fsb-failfast-mesh-connect
    proxy_connect_timeout 5s;
    proxy_pass $forward_scheme://$server:$port;
}
