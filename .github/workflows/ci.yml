name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pytest-cov
      - name: Unit tests + full package coverage (100%)
        run: pytest -q --cov=mail_janitor --cov-report=term-missing --cov-fail-under=100
